name: wander-app

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout-repos
        uses: actions/checkout@v6.1.0

      - name: setup-node-js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: install dependecies
        run: npm install
      - name: build the app
        run: npm run build

      - name: upload build on artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: nextjs-build
          path: out/
